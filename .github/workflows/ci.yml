name: CI

# Builds foxtrot with gcc, warnings as errors, and runs "make check", the
# unit tests, in the "check" stage of ci/Dockerfile.  The Dockerfile also
# builds the libgcrypt that foxtrot needs and Ubuntu 24.04 does not have.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The layers that build libgpg-error and libgcrypt do not change from
      # one push to the next, so they come from the Actions cache.
      - uses: docker/setup-buildx-action@v4

      - name: Build and run make check with gcc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/Dockerfile
          target: check
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
